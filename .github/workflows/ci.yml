name: CI Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Run Test Suite (Maths & APIs)
        run: npm test

      - name: Run AI Agent Evaluation Suite
        run: npm run eval

      - name: Build Production Bundles
        run: npm run build
